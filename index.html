    <script id="vite-ws-guard">
      (function() {
        var NativeWS = window.WebSocket;

        // Filter console errors and unhandled rejections related to vite websocket
        var origConsoleError = console.error;
        console.error = function() {
          var msg = '';
          for (var i = 0; i < arguments.length; i++) {
            msg += ' ' + String(arguments[i]);
          }
          if (msg.indexOf('failed to connect to websocket') !== -1 || msg.indexOf('WebSocket closed without opened') !== -1) {
            console.debug.apply(console, arguments);
            return;
          }
          origConsoleError.apply(console, arguments);
        };

        // Suppress unhandled promise rejections originating from Vite WebSocket reconnection attempts
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
          if (msg.toLowerCase().indexOf('websocket') !== -1 || (reason && reason.name === 'WebSocket')) {
            event.preventDefault();
            event.stopPropagation();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);

        // Suppress window error events for WebSocket connection notices
        window.addEventListener('error', function(event) {
          var msg = (event.message || event.filename || '') + '';
          if (msg.toLowerCase().indexOf('websocket') !== -1) {
            event.preventDefault();
            event.stopPropagation();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);

        if (!NativeWS) return;

        // Virtual WebSocket to reliably satisfy Vite HMR client without connection drops or rejections
        function VirtualViteWS(url, protocol) {
          this.url = String(url || '');
          this.protocol = typeof protocol === 'string' ? protocol : (Array.isArray(protocol) ? (protocol[0] || '') : '');
          this.readyState = 0; // CONNECTING
          this.bufferedAmount = 0;
          this.binaryType = 'blob';
          this.extensions = '';

          this._listeners = {};
          this.onopen = null;
          this.onmessage = null;
          this.onerror = null;
          this.onclose = null;

          var self = this;
          setTimeout(function() {
            if (self.readyState === 0) {
              self.readyState = 1; // OPEN
              var openEvt = { type: 'open', target: self, currentTarget: self };
              self._dispatch('open', openEvt);
              if (typeof self.onopen === 'function') self.onopen(openEvt);

              setTimeout(function() {
                if (self.readyState === 1) {
                  var msgEvt = {
                    type: 'message',
                    data: JSON.stringify({ type: 'connected' }),
                    target: self,
                    currentTarget: self
                  };
                  self._dispatch('message', msgEvt);
                  if (typeof self.onmessage === 'function') self.onmessage(msgEvt);
                }
              }, 10);
            }
          }, 0);
        }

        VirtualViteWS.prototype.CONNECTING = 0;
        VirtualViteWS.prototype.OPEN = 1;
        VirtualViteWS.prototype.CLOSING = 2;
        VirtualViteWS.prototype.CLOSED = 3;

        VirtualViteWS.prototype.addEventListener = function(type, listener, options) {
          if (typeof listener !== 'function') return;
          if (!this._listeners[type]) this._listeners[type] = [];
          this._listeners[type].push({
            fn: listener,
            once: !!(options && options.once)
          });
        };

        VirtualViteWS.prototype.removeEventListener = function(type, listener) {
          var arr = this._listeners[type];
          if (!arr) return;
          for (var i = 0; i < arr.length; i++) {
            if (arr[i].fn === listener) {
              arr.splice(i, 1);
              break;
            }
          }
        };

        VirtualViteWS.prototype._dispatch = function(type, event) {
          var arr = this._listeners[type];
          if (!arr) return;
          var copy = arr.slice();
          for (var i = 0; i < copy.length; i++) {
            try {
              copy[i].fn.call(this, event);
            } catch(e) {}
            if (copy[i].once) {
              this.removeEventListener(type, copy[i].fn);
            }
          }
        };

        VirtualViteWS.prototype.send = function(data) {
          var self = this;
          try {
            var parsed = typeof data === 'string' ? JSON.parse(data) : null;
            if (parsed && parsed.type === 'ping') {
              setTimeout(function() {
                if (self.readyState === 1) {
                  var msgEvt = {
                    type: 'message',
                    data: JSON.stringify({ type: 'pong' }),
                    target: self,
                    currentTarget: self
                  };
                  self._dispatch('message', msgEvt);
                  if (typeof self.onmessage === 'function') self.onmessage(msgEvt);
                }
              }, 10);
            }
          } catch(e) {}
        };

        VirtualViteWS.prototype.close = function(code, reason) {
          if (this.readyState === 3) return;
          this.readyState = 3;
          var closeEvt = {
            type: 'close',
            code: code || 1000,
            reason: reason || '',
            wasClean: true,
            target: this,
            currentTarget: this
          };
          this._dispatch('close', closeEvt);
          if (typeof this.onclose === 'function') this.onclose(closeEvt);
        };

        function isViteHmr(url, protocol) {
          if (protocol === 'vite-hmr' || (Array.isArray(protocol) && protocol.indexOf('vite-hmr') !== -1)) return true;
          var u = String(url || '').toLowerCase();
          if (u.indexOf('token=') !== -1 || u.indexOf('@vite') !== -1 || u.indexOf('vite-hmr') !== -1) return true;
          return false;
        }

        try {
          window.WebSocket = new Proxy(NativeWS, {
            construct: function(target, args) {
              var url = args[0];
              var protocol = args[1];
              if (isViteHmr(url, protocol)) {
                return new VirtualViteWS(url, protocol);
              }
              return Reflect.construct(target, args);
            }
          });
        } catch(e) {
          var WrappedWS = function(url, protocol) {
            if (isViteHmr(url, protocol)) {
              return new VirtualViteWS(url, protocol);
            }
            return new NativeWS(url, protocol);
          };
          WrappedWS.prototype = NativeWS.prototype;
          WrappedWS.CONNECTING = 0;
          WrappedWS.OPEN = 1;
          WrappedWS.CLOSING = 2;
          WrappedWS.CLOSED = 3;
          window.WebSocket = WrappedWS;
        }
      })();
    </script>
