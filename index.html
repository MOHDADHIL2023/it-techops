    <script>
      // Gracefully prevent unhandled promise rejections or errors from Vite dev-server WebSocket reconnection attempts
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (msg.toLowerCase().includes('websocket') || (reason && reason.name === 'WebSocket')) {
          event.preventDefault();
          event.stopPropagation();
          console.warn('[Vite WebSocket] Notice handled gracefully:', msg);
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event.message || event.filename || '') + '';
        if (msg.toLowerCase().includes('websocket')) {
          event.preventDefault();
          event.stopPropagation();
          console.warn('[Vite WebSocket] Connection notice handled gracefully.');
        }
      });
    </script>
